buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        mavenCentral()
        maven { url = 'https://maven.gofancy.wtf/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.+'
        classpath group: 'wtf.gofancy.fancygradle', name: 'wtf.gofancy.fancygradle.gradle.plugin', version: '+'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'wtf.gofancy.fancygradle'
// Single source of truth for the mod version. Tags.java and mcmod.info are
// checked/injected against this value by verifyModMetadata below.
version = '18.3'
group = 'com.jiezhirbmkmod'
archivesBaseName = 'RBMK-Monitor'
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
minecraft {
    mappings channel: 'stable', version: '39-1.12'
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    // JavaCV is an OPTIONAL client-side runtime dependency: the decoder is
    // loaded by reflection, so the mod never hard-links against it and can not
    // crash with NoClassDefFoundError when the natives are absent.
    // Uncomment for a dev setup that ships JavaCV + natives on the classpath:
    // implementation 'org.bytedeco:javacv-platform:1.5.9'
}
jar {
    manifest {
        attributes([
            'Implementation-Title'  : 'RBMK Monitor (JiezhiMod derived)',
            'Implementation-Version': project.version,
            'Specification-Vendor'  : 'jiezhi',
            'Specification-Title'   : 'jiezhirbmkmod',
            'Implementation-Vendor' : 'jiezhi'
        ])
    }
}
processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // mcmod.info carries a @VERSION@ token instead of a hand-copied version
    // number. ReplaceTokens is a literal token substitution: unlike Groovy's
    // expand() it never interprets backslash escapes, so the \n escapes in the
    // description stay intact. (expand() used to turn them into raw control
    // characters, which produced invalid strict JSON in the packaged file;
    // Forge's lenient Gson hid that in game.) The old
    // `from(sourceSets.main.resources.srcDirs)` line was also removed: it
    // re-added the default source set and only copied every resource twice.
    inputs.property 'version', project.version
    filteringCharset = 'UTF-8'
    filesMatching('mcmod.info') {
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [VERSION: project.version.toString()])
    }
}

tasks.register('verifyModMetadata') {
    group = 'verification'
    description = 'Fails the build when Tags.VERSION or mcmod.info drifts from project.version.'
    def tagsFile = file('src/main/java/com/jiezhirbmkmod/Tags.java')
    def metaFile = file('src/main/resources/mcmod.info')
    inputs.files(tagsFile, metaFile)
    doLast {
        String tags = tagsFile.getText('UTF-8')
        def m = tags =~ /static\s+final\s+String\s+VERSION\s*=\s*"([^"]+)"/
        if (!m.find()) {
            throw new GradleException("verifyModMetadata: no VERSION constant in ${tagsFile}.")
        }
        if (m.group(1) != project.version.toString()) {
            throw new GradleException("Version drift: Tags.VERSION=${m.group(1)} but project.version=${project.version}.")
        }
        String token = '@VERSION@'
        String meta = metaFile.getText('UTF-8')
        if (!meta.contains('"' + token + '"')) {
            throw new GradleException("verifyModMetadata: mcmod.info must carry the ${token} token in its version field.")
        }
        def parsed = new groovy.json.JsonSlurper().parseText(meta.replace(token, project.version.toString()))
        if (parsed[0].version != project.version.toString()) {
            throw new GradleException("verifyModMetadata: mcmod.info renders version ${parsed[0].version}, expected ${project.version}.")
        }
    }
}
compileJava.dependsOn tasks.named('verifyModMetadata')
processResources.dependsOn tasks.named('verifyModMetadata')
